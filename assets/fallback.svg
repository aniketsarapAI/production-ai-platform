<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 640" width="100%" height="100%">
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="500" height="640" fill="#F9FAFB" rx="12"/>

  <g transform="translate(130, 40)">
    <rect width="140" height="50" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="70" y="31" font-family="Segoe UI, San Francisco, sans-serif" font-weight="700" font-size="16" fill="#065F46" text-anchor="middle" letter-spacing="1">START</text>
  </g>

  <path d="M 200 90 L 200 140" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <g transform="translate(100, 140)">
    <rect width="200" height="70" rx="10" fill="#E6F4EA" stroke="#34A853" stroke-width="2"/>
    <text x="100" y="41" font-family="Fira Code, monospace" font-weight="600" font-size="18" fill="#137333" text-anchor="middle">process</text>
  </g>

  <path d="M 300 175 L 390 175" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="345" y="165" font-family="Segoe UI, sans-serif" font-style="italic" font-size="13" fill="#059669" text-anchor="middle">success</text>

  <g transform="translate(390, 150)">
    <circle cx="25" cy="25" r="25" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
    <text x="25" y="31" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13" fill="#374151" text-anchor="middle">END</text>
  </g>

  <path d="M 200 210 L 200 280" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="215" y="250" font-family="Segoe UI, sans-serif" font-style="italic" font-size="13" fill="#DC2626" text-anchor="start">fail</text>

  <g transform="translate(100, 280)">
    <rect width="200" height="70" rx="10" fill="#FFF3CD" stroke="#FFC107" stroke-width="2"/>
    <text x="100" y="41" font-family="Fira Code, monospace" font-weight="600" font-size="18" fill="#664D03" text-anchor="middle">fallback</text>
  </g>

  <path d="M 300 315 L 390 315" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="345" y="305" font-family="Segoe UI, sans-serif" font-style="italic" font-size="13" fill="#059669" text-anchor="middle">success</text>

  <g transform="translate(390, 290)">
    <circle cx="25" cy="25" r="25" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
    <text x="25" y="31" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13" fill="#374151" text-anchor="middle">END</text>
  </g>

  <path d="M 200 350 L 200 420" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="215" y="390" font-family="Segoe UI, sans-serif" font-style="italic" font-size="13" fill="#DC2626" text-anchor="start">fail</text>

  <g transform="translate(100, 420)">
    <rect width="200" height="70" rx="10" fill="#FCE8E6" stroke="#EA4335" stroke-width="2"/>
    <text x="100" y="36" font-family="Fira Code, monospace" font-weight="600" font-size="18" fill="#C5221F" text-anchor="middle">error</text>
    <text x="100" y="56" font-family="Segoe UI, sans-serif" font-style="italic" font-size="12" fill="#A51D24" text-anchor="middle">(graceful message)</text>
  </g>

  <path d="M 300 455 L 390 455" fill="none" stroke="#EA4335" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowRed)"/>

  <g transform="translate(390, 430)">
    <circle cx="25" cy="25" r="25" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
    <text x="25" y="31" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13" fill="#374151" text-anchor="middle">END</text>
  </g>
</svg>
