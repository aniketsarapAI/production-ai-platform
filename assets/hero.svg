<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E7EB" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="obsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="460" fill="#F9FAFB"/>
  <rect width="1200" height="460" fill="url(#grid)"/>
  
  <rect x="20" y="20" width="1160" height="420" rx="12" fill="none" stroke="#E5E7EB" stroke-width="2"/>

  <g transform="translate(60, 75)">
    <text x="0" y="0" font-family="Segoe UI, San Francisco, sans-serif" font-weight="800" font-size="38" fill="#1F2937" letter-spacing="-0.5">PRODUCTION AI PLATFORM</text>
    <text x="0" y="32" font-family="Fira Code, monospace" font-weight="500" font-size="16" fill="#4B5563">v1.0.0 • Enterprise-Ready LLM Gateway Middleware</text>
  </g>

  <g transform="translate(60, 160)">
    
    <g transform="translate(0, 30)">
      <rect width="160" height="70" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="80" y="36" font-family="Segoe UI, sans-serif" font-weight="600" font-size="14" fill="#374151" text-anchor="middle">Client Request</text>
      <text x="80" y="54" font-family="Fira Code, monospace" font-size="11" fill="#6B7280" text-anchor="middle">POST /chat</text>
    </g>

    <path d="M 160 65 L 200 65" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(200, 30)">
      <rect width="160" height="70" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
      <text x="80" y="36" font-family="Segoe UI, sans-serif" font-weight="600" font-size="14" fill="#92400E" text-anchor="middle">Rate Limiter</text>
      <text x="80" y="54" font-family="Fira Code, monospace" font-size="11" fill="#B45309" text-anchor="middle">slowapi (Per-IP)</text>
    </g>

    <path d="M 360 65 L 400 65" fill="none" stroke="#9CA3AF" stroke-width="2"/>

    <g transform="translate(400, 30)">
      <rect width="180" height="70" rx="8" fill="url(#secGrad)" stroke="#B45309" stroke-width="1.5"/>
      <text x="90" y="36" font-family="Segoe UI, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" text-anchor="middle">Security Guardrails</text>
      <text x="90" y="54" font-family="Fira Code, monospace" font-size="11" fill="#FEF3C7" text-anchor="middle">Regex Injn + PII Mask</text>
    </g>

    <path d="M 580 65 L 620 65" fill="none" stroke="#9CA3AF" stroke-width="2"/>

    <g transform="translate(620, 30)">
      <rect width="160" height="70" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
      <text x="80" y="36" font-family="Segoe UI, sans-serif" font-weight="600" font-size="14" fill="#1E40AF" text-anchor="middle">Response Cache</text>
      <text x="80" y="54" font-family="Fira Code, monospace" font-size="11" fill="#2563EB" text-anchor="middle">SHA-256 TTL Cache</text>
    </g>

    <path d="M 780 65 L 820 65" fill="none" stroke="#9CA3AF" stroke-width="2"/>

    <g transform="translate(820, 10)">
      <rect width="260" height="110" rx="10" fill="url(#blueGrad)" stroke="#1E40AF" stroke-width="2"/>
      <text x="130" y="32" font-family="Segoe UI, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle">LangGraph Orchestrator</text>
      <rect x="20" y="48" width="220" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.15"/>
      <text x="130" y="63" font-family="Fira Code, monospace" font-weight="500" font-size="11" fill="#FFFFFF" text-anchor="middle">Primary: gpt-4o-mini</text>
      <rect x="20" y="76" width="220" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.15"/>
      <text x="130" y="91" font-family="Fira Code, monospace" font-weight="500" font-size="11" fill="#FFFFFF" text-anchor="middle">Fallback: Dynamic Recovery</text>
    </g>
  </g>

  <g transform="translate(60, 345)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#E5E7EB" stroke-width="1.5"/>
    
    <g transform="translate(0, 20)">
      <rect width="130" height="30" rx="15" fill="#E6F4EA" stroke="#A7F3D0" stroke-width="1"/>
      <text x="65" y="19" font-family="Fira Code, monospace" font-weight="600" font-size="12" fill="#059669" text-anchor="middle">FastAPI Asgi</text>
    </g>

    <g transform="translate(145, 20)">
      <rect width="140" height="30" rx="15" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="70" y="19" font-family="Fira Code, monospace" font-weight="600" font-size="12" fill="#2563EB" text-anchor="middle">State Machine</text>
    </g>

    <g transform="translate(300, 20)">
      <rect width="150" height="30" rx="15" fill="#F9F5FF" stroke="#E9D5FF" stroke-width="1"/>
      <text x="75" y="19" font-family="Fira Code, monospace" font-weight="600" font-size="12" fill="#7C3AED" text-anchor="middle">LangSmith Tracing</text>
    </g>

    <g transform="translate(465, 20)">
      <rect width="130" height="30" rx="15" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
      <text x="65" y="19" font-family="Fira Code, monospace" font-weight="600" font-size="12" fill="#4B5563" text-anchor="middle">Docker Slim</text>
    </g>

    <g transform="translate(940, 20)">
      <text x="140" y="19" font-family="Segoe UI, sans-serif" font-weight="700" font-size="12" fill="#9CA3AF" text-anchor="end">DEPLOYED ON RENDER</text>
    </g>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9CA3AF"/>
    </marker>
  </defs>
</svg>
