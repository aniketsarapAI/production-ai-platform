<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <pattern id="hero-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E2E8F0" stroke-width="0.75" stroke-opacity="0.7"/>
    </pattern>
    
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <marker id="flow-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1200" height="480" fill="#F8FAFC"/>
  <rect width="1200" height="480" fill="url(#hero-grid)"/>
  
  <rect x="25" y="25" width="1150" height="430" rx="16" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <g transform="translate(70, 85)">
    <text x="0" y="0" font-family="Segoe UI, -apple-system, sans-serif" font-weight="900" font-size="42" fill="#0F172A" letter-spacing="-1">PRODUCTION AI PLATFORM</text>
    <text x="0" y="32" font-family="Fira Code, monospace" font-weight="600" font-size="15" fill="#64748B">Enterprise-Ready LLM Gateway &amp; Stateful Orchestration Mesh</text>
  </g>

  <g transform="translate(70, 175)">
    
    <g transform="translate(0, 25)">
      <rect width="140" height="75" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
      <text x="70" y="36" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13" fill="#334155" text-anchor="middle" letter-spacing="0.5">HTTP INGRESS</text>
      <rect x="15" y="46" width="110" height="18" rx="4" fill="#F1F5F9"/>
      <text x="70" y="59" font-family="Fira Code, monospace" font-weight="500" font-size="11" fill="#475569" text-anchor="middle">POST /chat</text>
    </g>
    <path d="M 140 62.5 L 185 62.5" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#flow-arrow)"/>

    <g transform="translate(185, 25)">
      <rect width="150" height="75" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2"/>
      <text x="75" y="36" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13" fill="#92400E" text-anchor="middle" letter-spacing="0.5">RATE LIMITER</text>
      <text x="75" y="58" font-family="Fira Code, monospace" font-weight="500" font-size="12" fill="#B45309" text-anchor="middle">slowapi (IP)</text>
    </g>
    <path d="M 335 62.5 L 380 62.5" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#flow-arrow)"/>

    <g transform="translate(380, 25)">
      <rect width="170" height="75" rx="10" fill="url(#shieldGrad)" stroke="#B45309" stroke-width="1.5"/>
      <text x="85" y="36" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">SECURITY GUARD</text>
      <text x="85" y="58" font-family="Fira Code, monospace" font-weight="500" font-size="11" fill="#FEF3C7" text-anchor="middle">Regex / PII Mask</text>
    </g>
    <path d="M 550 62.5 L 595 62.5" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#flow-arrow)"/>

    <g transform="translate(595, 25)">
      <rect width="160" height="75" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="2"/>
      <text x="80" y="36" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13" fill="#5B21B6" text-anchor="middle" letter-spacing="0.5">RESPONSE CACHE</text>
      <text x="80" y="58" font-family="Fira Code, monospace" font-weight="500" font-size="11" fill="#7C3AED" text-anchor="middle">SHA-256 (TTL)</text>
    </g>
    <path d="M 755 62.5 L 800 62.5" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#flow-arrow)"/>

    <g transform="translate(800, 0)">
      <rect width="260" height="125" rx="14" fill="url(#primaryGrad)" stroke="#1E40AF" stroke-width="2.5"/>
      <text x="130" y="32" font-family="Segoe UI, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.75">LANGGRAPH KERNEL</text>
      
      <rect x="15" y="48" width="230" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.12"/>
      <circle cx="30" cy="61" r="4" fill="#10B981"/>
      <text x="45" y="65" font-family="Fira Code, monospace" font-weight="500" font-size="12" fill="#F8FAFC">Primary: gpt-4o-mini</text>
      
      <rect x="15" y="82" width="230" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.12"/>
      <circle cx="30" cy="95" r="4" fill="#F59E0B"/>
      <text x="45" y="99" font-family="Fira Code, monospace" font-weight="500" font-size="12" fill="#F8FAFC">Fallback: Auto-Retry</text>
    </g>
  </g>

  <g transform="translate(70, 365)">
    <line x1="0" y1="0" x2="1060" y2="0" stroke="#E2E8F0" stroke-width="2"/>
    
    <g transform="translate(0, 24)">
      <rect width="135" height="32" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="67.5" y="20" font-family="Fira Code, monospace" font-weight="700" font-size="12" fill="#475569" text-anchor="middle">DOCKER SLIM</text>
    </g>

    <g transform="translate(150, 24)">
      <rect width="160" height="32" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
      <text x="80" y="20" font-family="Fira Code, monospace" font-weight="700" font-size="12" fill="#065F46" text-anchor="middle">LANGSMITH TRACED</text>
    </g>

    <g transform="translate(325, 24)">
      <rect width="145" height="32" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
      <text x="72.5" y="20" font-family="Fira Code, monospace" font-weight="700" font-size="12" fill="#1E40AF" text-anchor="middle">RENDER TARGET</text>
    </g>

    <g transform="translate(1060, 24)">
      <text x="0" y="20" font-family="Segoe UI, sans-serif" font-weight="800" font-size="13" fill="#94A3B8" text-anchor="end" letter-spacing="1">ZERO 500-ERROR LAYER PIPELINE</text>
    </g>
  </g>
</svg>
